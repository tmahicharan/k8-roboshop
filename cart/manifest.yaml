apiVersion: v1
kind: ConfigMap
metadata:
 name: cart
 namespace: roboshop
data:
 REDIS_HOST: "redis"
 CATALOGUE_HOST: "catalogue"
 CATALOGUE_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespcae: roboshop
  # these are replica set labels
  labels:
    component: cart
    project: roboshop
spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
      component: cart
      project: roboshop
  # pod definition
  template:
    metadata:
      labels:
        component: cart
        project: roboshop
    spec:
      containers:
      - name: cart
        image: tmahicharan/cart:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
          name: cart
        ports:
        - name: liveness-port
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          failureThreshold: 1
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          failureThreshold: 1
          periodSeconds: 15
---
#service
apiVersion: v1
kind: Service
metadata:
 name: cart
 namespace: roboshop
spec:
  selector:
   component: cart
   project: roboshop
   env: dev
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

 