apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespcae: roboshop
  # these are replica set labels
  labels:
    component: rabbitmq
    project: roboshop
spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
      component: rabbitmq
      project: roboshop
  # pod definition
  template:
    metadata:
      labels:
        component: rabbitmq
        project: roboshop
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.0
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: roboshop
        - name: RABBITMQ_DEFAULT_PASS
          value: roboshop123
        imagePullPolicy: Always
        readinessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 20
          periodSeconds: 5
---
#service
apiVersion: v1
kind: Service
metadata:
 name: rabbitmq
 namespace: roboshop
spec:
  selector:
   component: rabbitmq
   project: roboshop
   env: dev
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672

 